<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blind Date With a Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <p class="eyebrow">💌 YOUR BLIND DATE HAS ARRIVED</p>
    <h1 id="archetype">The Bad Decision</h1>
    <p id="teaser" class="teaser">You were warned.</p>

    <section class="gift-area">
      <button id="gift" class="gift" aria-label="Open your blind date">
        <span class="box">
          <span class="ribbon-v"></span>
          <span class="ribbon-h"></span>
          <span class="bow bow-left"></span>
          <span class="bow bow-right"></span>
          <span class="tag">#1<br><strong>The Bad<br>Decision</strong></span>
        </span>
        <span class="open-label">Click to open your date</span>
      </button>

      <article id="reveal" class="reveal" aria-hidden="true">
        <div class="heart">♥</div>
        <p class="match">IT'S A MATCH</p>
        <h2>Amid Clouds and Bones</h2>
        <p class="author">Ella Fields</p>
        <p class="message">You knowingly chose The Bad Decision.<br>We accept no responsibility for what happens next.</p>
        <button id="reset" class="reset">Wrap it back up</button>
      </article>
    </section>

    <footer>Blind Date With a Book · test package #1</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
